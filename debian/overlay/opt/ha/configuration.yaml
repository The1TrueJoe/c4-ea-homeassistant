
# Loads default set of integrations. Do not remove.
default_config:

# The box's own screen (openHC's web view, on this box's loopback) logs in
# without a password; everything else uses Home Assistant's own login. Trusted
# networks first, or the screen gets the password form.
homeassistant:
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
      allow_bypass_login: true
    - type: homeassistant

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
