# Music Assistant server (S98music-assistant, ma-install).
MA_VERSION=2.10.13
MA_DIR=/data/ma
MA_PYTHON=/opt/python/bin/python3
# One squeezelite per openHC output PCM ("pcm=name"); a PCM the board lacks is
# skipped. Players are named "<product> <name>" ("EA-3 Analog").
MA_PLAYERS="ohc_analog=Analog ohc_coax=Coax ohc_hdmi=HDMI"
