# The Home Assistant image for every openHC EA board: openHC's own bundle for
# the submodule's commit (from openHC's CI) with a Debian root in place of
# Buildroot's (debian/build.sh). No Buildroot build here.

name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: "Single EA board to build (blank = all)"
        required: false
  release:
    types: [published]

concurrency:
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # attach to a release

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.pick.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: pick
        run: |
          if [ -n "${{ inputs.board }}" ]; then b='["${{ inputs.board }}"]'
          else b=$(build/boards.sh | jq -R . | jq -sc .); fi
          echo "boards=$b" >> "$GITHUB_OUTPUT"

  image:
    needs: boards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.boards.outputs.boards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: openHC's bundle for the submodule's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/openhc-bundle.sh ${{ matrix.board }} output/openhc-${{ matrix.board }}.zip
      - name: Debian root
        run: |
          v=$(git describe --always --dirty)
          make image BOARD=${{ matrix.board }} OPENHC_BUNDLE=output/openhc-${{ matrix.board }}.zip \
            OUT=output/openhc-ha-${{ matrix.board }}-$v.zip
          echo "ZIP=output/openhc-ha-${{ matrix.board }}-$v.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: openhc-ha-${{ matrix.board }}
          path: ${{ env.ZIP }}
          compression-level: 0
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber
